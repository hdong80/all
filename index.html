<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>풍문 생기부 기본룰 검사기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>풍문 생기부 기본룰 검사기</h1>
        
        <div class="main-content">
            <div class="text-area-container">
                <div class="text-box">
                    <h2>원본 텍스트</h2>
                    <textarea id="originalText" placeholder="검사할 텍스트를 붙여넣으세요"></textarea>
                    <div class="byte-info">바이트 수: <span id="originalBytes">0</span></div>
                </div>
                
                <div class="text-box">
                    <h2>수정된 텍스트</h2>
                    <div id="modifiedText" contenteditable="true" class="editable-div" placeholder="원본 텍스트를 입력하면 수정된 내용이 표시됩니다"></div>
                    <div class="byte-info">바이트 수: <span id="modifiedBytes">0</span></div>
                </div>
            </div>
            
            <div class="button-container">
                <button id="copyButton" class="primary-button">수정된 내용 복사</button>
                <button id="resetButton" class="secondary-button">리셋</button>
            </div>
        </div>
        
        <div class="status-board">
            <h2>수정 현황</h2>
            <div id="statusContent">
                <p class="status-empty">텍스트를 입력하면 수정 내역이 표시됩니다.</p>
            </div>
        </div>
        
        <div class="info-section">
            <h3>검사 항목</h3>
            <ul>
                <li>두 칸 이상의 공백 → 한 칸으로 변환</li>
                <li>스마트 부호 → 일반 부호로 변환</li>
                <li>날짜 형식 검증 (예: (2025.06.07.) 형식)</li>
                <li>금지어 검사 (빨간색 표시)</li>
                <li>허용 영어단어 검사 (초록색 표시)</li>
                <li>문장 끝 마침표 검사</li>
            </ul>
            <p class="warning-text">※ 금지어 사용 여부에 대해 궁금한 점은 교무기획부에 문의해주세요.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
